<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Energy | AI Forecast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-8 font-sans">
    
    <div class="max-w-5xl mx-auto">
        <header class="mb-10 border-b border-gray-700 pb-4">
            <h1 class="text-4xl font-bold text-blue-400">EU Day-Ahead Energy Oracle</h1>
            <p class="text-gray-400 mt-2">Automated Machine Learning Pipeline & Price Forecasting</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg">
                <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-2">Current Baseline Price</h3>
                <p id="current-price" class="text-3xl font-bold text-white">Loading...</p>
                <p id="last-updated" class="text-xs text-gray-500 mt-2">Updated: ...</p>
            </div>
            <div class="bg-blue-900/20 p-6 rounded-lg border border-blue-800/50 shadow-lg">
                <h3 class="text-blue-400 text-sm font-semibold uppercase tracking-wider mb-2">Llama 3.3 AI Analysis</h3>
                <p id="ai-analysis" class="text-md text-blue-100 font-medium">Loading prediction...</p>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg">
            <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-4">7-Day Price Trend & Forecast</h3>
            <canvas id="forecastChart" height="100"></canvas>
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                // Update Text Cards
                document.getElementById('current-price').innerText = data.current_price;
                document.getElementById('last-updated').innerText = "Last AWS Pipeline Run: " + data.last_updated;
                document.getElementById('ai-analysis').innerText = data.ai_analysis;

                // Build the Chart
                const ctx = document.getElementById('forecastChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [
                            {
                                label: 'Actual Price (€/MWh)',
                                data: data.actual_prices,
                                borderColor: '#9ca3af', // Gray
                                backgroundColor: 'rgba(156, 163, 175, 0.2)',
                                borderWidth: 3,
                                tension: 0.3
                            },
                            {
                                label: 'AI Forecast (€/MWh)',
                                data: data.predicted_prices,
                                borderColor: '#60a5fa', // Blue
                                backgroundColor: 'rgba(96, 165, 250, 0.2)',
                                borderWidth: 3,
                                borderDash: [5, 5], // Dashed line for future
                                tension: 0.3,
                                pointBackgroundColor: '#60a5fa'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { labels: { color: '#e5e7eb' } } },
                        scales: {
                            y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                            x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }
                        }
                    }
                });
            })
            .catch(error => console.error('Error loading data:', error));
    </script>
</body>
</html>
